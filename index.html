<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Chalkline — calisthenics tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--ink:#F3EFE8;--mute:#A6A199;--dim:#6E6A63;--line:#232323;--line2:#3B3B3B;--lift:#0E0E0E;
  --main:#E5383B;--part:#F2C230;--r:3px;
  --rose:#EC4A72;--orange:#F58A3C;--gamboge:#F2C230;--lime:#A9CF45;--emerald:#2FC08E;--cerulean:#35ADE6;--ultra:#6470F0;--violet:#A565EA;
  --font:"Archivo","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
body{margin:0;min-height:100%;background:#000;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
svg{display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell */
.side{display:none}
.main{position:relative;z-index:1;padding:14px 14px 104px;max-width:1220px}
.bgwash{position:fixed;z-index:0;pointer-events:none;background-size:100% 100%;opacity:.13}
.bgwash.a{right:-140px;top:-120px;width:520px;height:520px}
.bgwash.b{left:-180px;bottom:-160px;width:560px;height:560px;opacity:.1}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));background:#000;border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--dim);font-size:10px;font-stretch:75%;font-weight:600;position:relative;min-width:0}
.tab svg{width:20px;height:20px}
.tab span{max-width:100%;overflow:hidden;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg,.snav[aria-current="page"] svg{color:var(--tc,var(--ink))}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--tc,var(--ink))}
@media (min-width:960px){
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;position:fixed;z-index:2;background:#000;left:0;top:0;bottom:0;width:224px;border-right:1px solid var(--line);padding:22px 14px 16px;gap:2px;overflow:auto}
  .main{margin-left:224px;padding:26px 34px 60px}
  .brand{position:relative;isolation:isolate;font-stretch:122%;font-weight:800;font-size:21px;letter-spacing:-.01em;padding:0 10px 20px}
  .brand::before{content:"";position:absolute;z-index:-1;left:-8px;top:-14px;width:176px;height:58px;background-size:100% 100%;opacity:.8}
  .snav{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r);color:var(--mute);font-weight:550;font-size:14.5px;position:relative}
  .snav svg{width:19px;height:19px;flex:none}
  .snav:hover{color:var(--ink)}
  .snav[aria-current="page"]{color:var(--ink);background:var(--lift)}
  .snav[aria-current="page"]::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;background:var(--tc,var(--ink))}
  .side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);display:grid;gap:10px}
}
.wk{display:flex;align-items:baseline;gap:8px}
.wk b{font-stretch:122%;font-weight:800;font-size:26px;line-height:1}
.wk span{color:var(--mute);font-size:12.5px}

/* ---------- page head */
.phead{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:start;min-height:96px;padding:16px 2px 14px;margin-bottom:14px;isolation:isolate}
.phead::before{content:"";position:absolute;z-index:-1;left:-14px;top:-4px;width:min(520px,92%);height:92px;background-size:100% 100%;background-repeat:no-repeat;opacity:.9}
.phead h1{font-stretch:122%;font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1.05;letter-spacing:-.015em}
.phead .sub{grid-column:1/-1;color:var(--mute);font-size:13.5px;max-width:56ch;align-self:end}
.phead-tools{display:flex;gap:8px;align-items:center}
@media (min-width:960px){.phead{min-height:124px;padding-top:26px}.phead::before{height:112px;top:0}.phead .only-m{display:none}}
/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border:1px solid var(--line2);border-radius:var(--r);font-weight:600;font-size:13.5px;white-space:nowrap;background:#000}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--ink);color:#000;border-color:var(--ink)}
.btn.pri:hover{background:#fff}
.btn.big{min-height:48px;font-size:15.5px;width:100%}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px}
.btn.danger{color:#ff8587;border-color:#5a2224}
.btn[disabled]{opacity:.35;cursor:default}
.btn svg{width:16px;height:16px}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);display:inline-grid;place-items:center;flex:none;background:#000}
.ib:hover{border-color:var(--mute)}
.ib svg{width:17px;height:17px}
.ib.sm{width:30px;height:30px}.ib.sm svg{width:14px;height:14px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 13px;border:1px solid var(--line2);border-radius:999px;font-size:13px;font-weight:550;color:var(--mute);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip.amt{gap:7px}.chip.amt b{color:var(--ink);font-weight:700}.chip.amt span{font-size:12px}
.chip.amt[aria-pressed="true"] b{color:#000}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--mute))}
.tag{display:inline-flex;align-items:center;min-height:21px;padding:0 8px;border:1px solid var(--line2);border-radius:999px;font-size:11.5px;color:var(--mute);white-space:nowrap}
.field{width:100%;min-height:42px;padding:0 12px;background:#000;border:1px solid var(--line2);border-radius:var(--r);color:var(--ink)}
.field::placeholder{color:var(--dim)}
.lab{display:block;font-size:12.5px;color:var(--mute);margin-bottom:6px;font-weight:550}

/* ---------- sections */
.secs{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:start}
.sec{grid-column:span 12;border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
@media (min-width:960px){.sec.half{grid-column:span 6}.sec{padding:20px}}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:30px}
.sec-h h2{position:relative;font-size:16px;font-weight:720;font-stretch:108%;letter-spacing:-.005em;padding-bottom:8px}
.sec-h h2::after{content:"";position:absolute;left:-3px;bottom:0;width:58px;height:7px;background:var(--ws) 0 0/100% 100% no-repeat}
.sec-h .aside{color:var(--mute);font-size:12.5px}
.arr .sec{border-style:dashed;border-color:var(--line2)}
.sec-tools{display:flex;gap:6px}
.w-toggle{display:none}
@media (min-width:960px){.w-toggle{display:inline-flex}}
.hidden-list{grid-column:span 12;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--mute);font-size:13px}
.empty{color:var(--mute);font-size:14px;padding:6px 0 2px;max-width:52ch}
.empty .btn{margin-top:12px}

/* ---------- exercise rows */
.rows{display:grid}
.row{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%}
.rows>.row:first-child{border-top:0;padding-top:0}
.rows>.row:last-child{padding-bottom:0}
button.row:hover .nm{text-decoration:underline;text-underline-offset:3px}
.thumb{width:60px;height:60px;background-size:100% 100%;color:var(--ink);flex:none}
.thumb.lg{width:100%;max-width:230px;height:auto;aspect-ratio:1}
.thumb.md{width:76px;height:76px}
.thumb.xs{width:48px;height:48px}
.fig{width:100%;height:100%}
.fig path,.fig ellipse,.fig rect{vector-effect:non-scaling-stroke}
.fig .a{stroke-width:2px}.fig .b{stroke-width:.8px}.fig .c{stroke-width:1.1px}
.thumb.lg .fig .a,.goal .fig .a{stroke-width:3px}.thumb.lg .fig .b,.goal .fig .b{stroke-width:1.1px}.thumb.lg .fig .c,.goal .fig .c{stroke-width:1.6px}
.nm{display:block;font-weight:650;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 9px;margin-top:4px;color:var(--mute);font-size:12.5px}
.right{text-align:right;color:var(--mute);font-size:12.5px;line-height:1.3}
.right b{display:block;color:var(--ink);font-size:15px;font-weight:700}
.meta.warm{color:var(--ink);flex-wrap:nowrap;align-items:baseline}
.meta.warm .dot{position:relative;top:-1px}
.warmbox{border:1px solid var(--line2);border-radius:var(--r);padding:14px;margin-top:14px}
.warmbox h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:720}
.stars{position:relative;display:inline-block;width:84px;height:13px;flex:none}
.stars i{position:absolute;inset:0;background:repeat-x left center/14px 13px}
.stars .s0{opacity:.22}
.bm{width:58px;height:48px;flex:none}
.bm.lg{width:100%;max-width:250px;height:auto}
.bm rect,.bm circle{fill:#272727}
.bm .m{fill:var(--main)}.bm .p{fill:var(--part)}
.bm.pick rect[data-m]{cursor:pointer}
.bm text{fill:var(--mute);font-size:7px;font-weight:600;text-anchor:middle}
.desc{font-size:14.5px;line-height:1.5;max-width:60ch;margin:0 0 4px}
.chart.sm{height:120px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sq{width:10px;height:10px;background:var(--c)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:0 28px}
.cards .row{border-top:1px solid var(--line)!important;padding:11px 0!important}

/* ---------- brush bars */
.bar{position:relative;height:16px;background:var(--lift);border-radius:var(--r);overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background-size:100% 100%}
.bar.thin{height:10px}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:10px;background-color:var(--lift);background-size:100% 100%;border-radius:1px}
.segs i[class*="w-"]{background-color:transparent}
.segs i.cur{outline:1px solid var(--ink);outline-offset:1px}

/* ---------- project cards */
.pgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.pcard{position:relative;display:grid;gap:12px;padding:16px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;isolation:isolate;width:100%;min-height:190px;align-content:end}
.pcard:hover{border-color:var(--line2)}
.pcard .wash{position:absolute;z-index:-1;right:-30px;top:-34px;width:210px;height:210px;background-size:100% 100%;opacity:.95}
.pcard .goal{position:absolute;right:14px;top:10px;width:112px;height:112px;color:var(--ink)}
.pcard .pn{display:block;font-stretch:118%;font-weight:800;font-size:23px;line-height:1.05;max-width:60%;letter-spacing:-.01em}
.pcard .cnt{color:var(--mute);font-size:12.5px;margin-top:5px}
.pcard .now{font-size:13.5px}
.pcard .now span{color:var(--mute)}
.ladder{display:grid}
.step{display:grid;grid-template-columns:30px 60px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%}
.step:first-child{border-top:0}
.num{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--mute)}
.step.ok .num{background:var(--pc);border-color:var(--pc);color:#000}
.step.cur .num{border-color:var(--ink);color:var(--ink)}
.step.next{opacity:.62}
.phero{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;border:1px solid var(--line);border-radius:var(--r);padding:20px;overflow:hidden;margin-bottom:14px;min-height:190px}
.phero .wash{position:absolute;z-index:-1;right:-40px;top:-50px;width:340px;height:340px;background-size:100% 100%}
.phero h1{font-stretch:122%;font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1;letter-spacing:-.015em}
.phero .goal{width:clamp(110px,26vw,170px);height:clamp(110px,26vw,170px);color:var(--ink)}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c);border:2px solid #000;outline:1px solid var(--line2)}
.sw[aria-pressed="true"]{outline:2px solid var(--ink)}
.edit-step{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.edit-step .ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}

/* ---------- steppers */
.stp{display:inline-flex;align-items:center;gap:8px}
.stp b{min-width:54px;text-align:center;font-weight:700;font-size:14px}
.stp.xl{gap:14px}
.stp.xl b{font-stretch:122%;font-weight:800;font-size:40px;line-height:1;min-width:96px}
.stp.xl .ib{width:46px;height:46px}
.stp.xl input{width:104px;text-align:center;background:none;border:0;border-bottom:1px solid var(--line2);border-radius:0;font-stretch:122%;font-weight:800;font-size:40px;line-height:1;padding:0 0 4px;-moz-appearance:textfield;appearance:textfield}
.stp.xl input::-webkit-outer-spin-button,.stp.xl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp.xl small{display:block;font-size:12px;color:var(--mute);font-weight:500;font-stretch:100%;margin-top:3px}

/* ---------- numbers and charts */
.big{position:relative;isolation:isolate;font-stretch:122%;font-weight:800;font-size:clamp(46px,9vw,68px);line-height:.95;letter-spacing:-.02em}
.big::before{content:"";position:absolute;z-index:-1;left:-22px;top:-26px;width:170px;height:128px;background:var(--wb) 0 0/100% 100% no-repeat;opacity:.5}
.big small{font-size:15px;font-weight:550;color:var(--mute);font-stretch:100%;letter-spacing:0;margin-left:6px}
.duo{display:grid;gap:12px;margin-top:16px}
.duo .l{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:5px}
.duo .l b{color:var(--ink)}
.delta{font-size:14px;margin-top:8px;color:var(--mute)}
.delta b{color:var(--ink)}
.chart{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;height:220px}
.col{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:6px;min-width:0}
.col .bw{position:relative;margin-top:20px;border-bottom:1px solid var(--line2)}
.col .b{position:absolute;left:8%;right:8%;bottom:0;background-size:100% 100%;opacity:.5}
.col .v{position:absolute;left:0;right:0;font-size:11px;color:var(--mute);text-align:center;font-weight:600;white-space:nowrap;padding-bottom:3px}
.col.now .b{opacity:1}.col.now .v{color:var(--ink)}
.col .x{font-size:11px;color:var(--dim);text-align:center;white-space:nowrap;overflow:hidden;font-stretch:85%}
.col.now .x{color:var(--ink)}
.src{display:grid;grid-template-columns:104px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:13px;padding:6px 0}
.src b{text-align:right}
.rules{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:var(--mute);font-size:12.5px;display:grid;gap:4px}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ent:first-child{border-top:0}
.ent .pts{font-weight:750;font-stretch:112%;color:var(--tc,var(--ink))}
.bon{display:inline-flex;gap:5px;flex-wrap:wrap}
.bon .tag{border-color:transparent;background:var(--lift);color:var(--ink)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px;font-size:13px;color:var(--mute);border-top:1px solid var(--line2);margin-top:8px}
.dayh:first-child{border-top:0;margin-top:0;padding-top:0}
.dayh b{color:var(--ink);font-size:14px}

/* ---------- plan */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:grid;gap:5px;justify-items:center;padding:9px 2px 8px;border:1px solid var(--line);border-radius:var(--r);min-height:86px;align-content:start}
.day small{font-size:11px;color:var(--mute);font-stretch:88%}
.day b{font-stretch:118%;font-weight:800;font-size:19px;line-height:1}
.day .dots{display:flex;gap:3px;min-height:9px;flex-wrap:wrap;justify-content:center}
.day .n{font-size:10.5px;color:var(--dim)}
@media (max-width:640px){.day .n .w{display:none}}
.day[aria-pressed="true"]{border-color:var(--tc,var(--ink));background:var(--lift)}
.day.tod small{color:var(--ink);font-weight:700}
.pitem{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.pitem .ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.opt{display:grid;gap:8px;margin-bottom:16px}

/* ---------- sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72)}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:93%;overflow:auto;background:#000;border-top:1px solid var(--line2);padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
@media (min-width:960px){.sheet{left:auto;top:0;width:480px;max-height:none;border-top:0;border-left:1px solid var(--line2);padding:24px}}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sh-top h2{font-stretch:118%;font-weight:800;font-size:26px;line-height:1.05;letter-spacing:-.01em}
.xgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center;margin:6px 0 16px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);margin:14px 0}
.kv.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.kv div{padding:10px 12px;background:#000}
.kv small{display:block;color:var(--mute);font-size:11.5px}
.kv b{font-size:16px;font-weight:750}
.logbox{border:1px solid var(--line2);border-radius:var(--r);padding:16px;display:grid;gap:16px;margin-top:14px}
.logbox .two{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pre{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pre .t{font-stretch:122%;font-weight:800;font-size:24px}
.grp{margin-top:18px}
.grp h3{font-size:13px;color:var(--mute);font-weight:600;margin-bottom:8px}
.form{display:grid;gap:16px}
.posegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.posegrid button{border:1px solid var(--line);border-radius:var(--r);color:var(--ink)}
.posegrid button[aria-pressed="true"]{border-color:var(--ink);background:var(--lift)}
.starpick{display:flex;align-items:center;gap:12px}

/* ---------- toast */
.toast{position:fixed;z-index:60;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(430px,calc(100% - 24px));background:#000;border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;isolation:isolate;overflow:hidden}
@media (min-width:960px){.toast{bottom:28px;left:calc(50% + 112px)}}
.toast .splash{position:absolute;z-index:-1;left:-46px;top:50%;width:200px;height:200px;margin-top:-100px;background-size:100% 100%;animation:bloom .9s cubic-bezier(.2,.8,.2,1) both}
.toast .t{font-stretch:122%;font-weight:800;font-size:30px;line-height:1}
.toast .d{font-size:12.5px;color:var(--mute)}
@keyframes bloom{from{transform:scale(.2) rotate(-25deg);opacity:0}60%{opacity:1}to{transform:scale(1) rotate(0);opacity:.95}}
@media (prefers-reduced-motion:reduce){.toast .splash{animation:none}}
.sync{font-size:12px;color:var(--dim)}
</style>

const figCache={};
function figure(key){

  const bodyMaxY=Math.max(...body.map(q=>q[1]));

  const pts=[...body,[head[0]-LEN.HR,head[1]-LEN.HR],[head[0]+LEN.HR,head[1]+LEN.HR]];
  if(F1)pts.push(F1[1]); if(F2)pts.push(F2[1]);

  let x0=Math.min(...pts.map(v=>v[0])),x1=Math.max(...pts.map(v=>v[0])),y0=Math.min(...pts.map(v=>v[1])),y1=Math.max(...pts.map(v=>v[1]));
  if(floorY!==null){x0-=5;x1+=5;y1=Math.max(y1,floorY)}
  const w=x1-x0,h=y1-y0,s=Math.min(80/w,80/h,1.28),tx=50-(x0+w/2)*s,ty=50-(y0+h/2)*s;
  
  const wob=(a,b,k)=>{const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1,o=(R()-.5)*len*k;return `Q${r1(mx-dy/len*o)} ${r1(my+dx/len*o)} ${r1(b[0])} ${r1(b[1])}`};
  const path=(arr,k=.13)=>{let d=`M${r1(arr[0][0])} ${r1(arr[0][1])}`;for(let i=1;i<arr.length;i++)d+=wob(arr[i-1],arr[i],k);return d};
  const line=(arr,op=1)=>`<path class="a" d="${path(arr)}" opacity="${op}"/><path class="b" d="${path(arr,.3)}" opacity="${op*.6}"/>`;
  let o=`<svg class="fig" viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(${r1(tx)} ${r1(ty)}) scale(${s.toFixed(3)})" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">`;

  if(floorY!==null)o+=`<path class="c" d="${path([[x0,floorY],[x0+w/2,floorY],[x1,floorY]],.02)}"/>`;
  for(const q of props){
    if(q[0]==='l')o+=`<path class="${q[5]>1?'a':'c'}" d="M${r1(q[1])} ${r1(q[2])}L${r1(q[3])} ${r1(q[4])}"/>`;

  }

  o+=`</g></svg>`;
  return figCache[key]=o;
}

/* ---- derived stats (memoized per change) */
let _st=null;
function bump(){_st=null}
function stats(){
  if(_st)return _st;
  const by={},days={},grp={};
  const log=[...S.log].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.t-b.t);
  for(const e of log){
    const s=by[e.ex]||(by[e.ex]={best:0,bestD:null,last:null,count:0,pts:0});
    if(e.n>s.best){s.best=e.n;s.bestD=e.d}
    s.last=e.d;s.count++;s.pts+=e.p;days[e.d]=(days[e.d]||0)+e.p;
    const g=X(e.ex).g; if(!grp[g]||grp[g]<e.d)grp[g]=e.d;
  }
  return _st={by,days,grp,log};
}
function projStatus(pr){
  const st=stats();let peak=-1,cur=-1,cleared=0;
  const steps=pr.steps.map((s,i)=>{const b=st.by[s.ex]?.best||0,ok=b>=s.target;if(ok){peak=i;cleared++}else if(cur<0)cur=i;return{...s,i,best:b,ok}});
  return{steps,peak,cur,cleared,done:steps.length>0&&cleared===steps.length,n:steps.length};
}
const rangePts=(from,to)=>{const d=stats().days;let t=0;for(const k in d)if(k>=from&&k<=to)t+=d[k];return t};

/* ---- scoring */
function score(exId,n,d,log=S.log){
  const e=X(exId),base=basePts(e,n);
  const prior=log.filter(x=>x.ex===exId&&x.d<=d);
  let fresh=0,peak=0,step=0,flags='',gap=null;
  if(!prior.length){fresh=Math.max(3,Math.round(base*.5));flags+='N'}
  else{
    const last=prior.reduce((m,x)=>x.d>m?x.d:m,'');gap=diffDays(d,last);
    if(gap>3)fresh=Math.round(base*Math.min(.5,.05*(gap-3)));
    const best=Math.max(...prior.map(x=>x.n));
    if(n>best){peak=Math.round(base*.5)+10;flags+='P'}
  }
  const bestAll=Math.max(0,...log.filter(x=>x.ex===exId).map(x=>x.n));
  for(const pr of S.projects)pr.steps.forEach((s,i)=>{
    if(s.ex===exId&&n>=s.target&&bestAll<s.target){step+=Math.round(20*e.d)+(i===pr.steps.length-1?100:0);if(!flags.includes('S'))flags+='S'}
  });
  return{base,fresh,peak,step,total:base+fresh+peak+step,flags,gap};
}
function addLog(exId,n,d,sets=1){
  const made=[];
  for(let i=0;i<sets;i++){
    const sc=score(exId,n,d);
    const en={id:uid(),ex:exId,n,d,t:Date.now()+i,p:sc.total,b:[sc.base,sc.fresh,sc.peak,sc.step],f:sc.flags};
    S.log.push(en);made.push(en);bump();
  }
  dirty('log-'+d.slice(0,7));
  return made;
}
function removeLog(ids){
  const months=new Set();
  S.log=S.log.filter(e=>{if(ids.includes(e.id)){const mo=e.d.slice(0,7);months.add('log-'+mo);(S.gone[mo]||(S.gone[mo]=[])).push(e.id);return false}return true});
  bump();months.forEach(dirty);
}

// where data lives: a Chalkline account, else this person's own Claude login, else just this device
function setBase(){

  store.lsKey=store.acct&&!store.server?LS+'.acct.'+store.acct.id:LS;
  store.dirty.clear();store.err=false;
}
function saveLocal(){try{localStorage.setItem(store.lsKey,JSON.stringify(S))}catch(e){}}
function loadLocal(){S=blank();try{const r=localStorage.getItem(store.lsKey);if(r){const o=JSON.parse(r);if(o&&o.v===1)S=Object.assign(blank(),o)}}catch(e){}bump()}
function dirty(doc){

}
function docBody(id){
  if(id==='main'){
    const cut=addDays(today(),-21),plan={};
    for(const k in S.plan)if(k>=cut)plan[k]=S.plan[k];
    return{v:1,custom:S.custom,projects:S.projects,plan,layout:S.layout,wiped:S.wiped||0,at:S.ts.main||Date.now()};
  }

}
async function flush(){
  if(store.busy||!store.db||!store.base||!store.dirty.size)return;
  store.busy=true;
  const base=store.base,ids=[...store.dirty];store.dirty.clear();
  for(const id of ids){
    try{await store.db.collection(base).doc(id).set(clone(docBody(id)));store.err=false}
    catch(e){store.err=true;if(store.base===base)store.dirty.add(id)}
  }

async function flushNow(){clearTimeout(store.timer);for(let i=0;i<80&&store.busy;i++)await new Promise(r=>setTimeout(r,50));await flush()}
// Logged sets are merged, never overwritten: two devices that both logged while the other was
// stale each keep every set. Deleted sets are remembered by id; "erase everything" is a timestamp.
function mergeMonth(mo,r){
  const local=S.log.filter(e=>e.d.startsWith(mo)),lg=S.gone[mo]||[],re=(r&&r.entries)||[],rg=(r&&r.gone)||[];
  const gone=[...new Set([...lg,...rg])],g=new Set(gone),w=S.wiped||0,m=new Map();
  for(const e of[...re,...local])if(e&&e.id&&!g.has(e.id)&&(e.t||0)>w)m.set(e.id,e);
  const merged=[...m.values()],lid=new Set(local.map(e=>e.id)),rid=new Set(re.map(e=>e.id));
  const changed=merged.length!==local.length||merged.some(e=>!lid.has(e.id))||gone.length!==lg.length;
  const push=r?(merged.length!==rid.size||merged.some(e=>!rid.has(e.id))||gone.length!==rg.length||w>(r.wiped||0)):(merged.length>0||gone.length>0);
  if(changed){S.log=S.log.filter(e=>!e.d.startsWith(mo)).concat(merged);if(gone.length)S.gone[mo]=gone}
  return{changed,push};
}
function applyRemote(remote){
  let changed=false;
  const w=Math.max(S.wiped||0,...Object.values(remote).map(r=>(r&&r.wiped)||0));
  if(w>(S.wiped||0)){S.wiped=w;S.log=S.log.filter(e=>(e.t||0)>w);changed=true}
  const m=remote.main;
  if(m&&(m.at||0)>=(S.ts.main||0)){
    S.custom=m.custom||{};S.projects=m.projects||[];S.plan=m.plan||{};S.layout=m.layout||{};S.ts.main=m.at||0;changed=true;
  }else if(S.ts.main)store.dirty.add('main');
  if(m&&(m.wiped||0)<(S.wiped||0))store.dirty.add('main');
  const months=new Set([...Object.keys(remote).filter(k=>k.startsWith('log-')).map(k=>k.slice(4)),...S.log.map(e=>e.d.slice(0,7)),...Object.keys(S.gone)]);
  for(const mo of months){const x=mergeMonth(mo,remote['log-'+mo]);if(x.changed)changed=true;if(x.push)store.dirty.add('log-'+mo)}
  if(changed){bump();saveLocal()}
  return changed;
}
async function pull(){
  if(!store.db||!store.base)return false;
  try{
    const base=store.base,snap=await store.db.collection(base).get(),remote={};
    if(store.base!==base)return false;
    snap.docs.forEach(d=>{remote[d.id]=clone(d.data())});
    const ch=applyRemote(remote);
    if(store.dirty.size)flush();
    return ch;
  }catch(e){store.err=true;if(e&&e.status===401&&store.server){store.locked=true;askKey()}return false}
}

/* ---- Chalkline accounts: a name and a light password, kept in this page's shared store */
const normName=n=>String(n||'').trim().toLowerCase().replace(/[^a-z0-9_-]/g,'');
async function hashPw(salt,pw){
  const s=salt+':'+pw;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=hash(s),o='';for(let i=0;i<8;i++){h=hash(h+s+i);o+=h.toString(16).padStart(8,'0')}return'f'+o}
}
function readSession(){try{const o=JSON.parse(localStorage.getItem(SESSION)||'null');return o&&o.id&&o.hash?o:null}catch(e){return null}}

const NO_DB='Accounts work when this page is open in Claude and you are signed in to Claude.';
async function acctCreate(name,pw){
  if(!store.db)return NO_DB;
  const id=normName(name),shown=String(name).trim().slice(0,20);
  if(id.length<3||id.length>20)return'Pick a name of 3 to 20 letters or numbers.';
  if(String(pw).length<4)return'Use a password of at least 4 characters.';
  try{
    const ref=store.db.doc('accounts/'+id);
    if((await ref.get()).exists)return'That name is taken. Sign in instead, or pick another.';
    const salt=uid(),h=await hashPw(salt,pw);
    await ref.set({name:shown,salt,hash:h,at:Date.now()});
    await flushNow();
    store.acct={id,name:shown,hash:h};saveSession();setBase();
    // whatever is logged on this device so far comes along into the new account
    const now=Date.now();S.ts={main:now};S.log.forEach(e=>{S.ts['log-'+e.d.slice(0,7)]=now});
    saveLocal();Object.keys(S.ts).forEach(k=>store.dirty.add(k));flush();
    return'';
  }catch(e){return'Could not create the account. You may only have view access to this page. Ask its owner to share it with you as a Contributor or Editor.'}
}
async function acctLogin(name,pw){
  if(!store.db)return NO_DB;
  const id=normName(name);
  if(!id)return'Enter your account name.';
  try{
    const snap=await store.db.doc('accounts/'+id).get();
    if(!snap.exists)return'No account with that name.';
    const a=snap.data();
    if(await hashPw(a.salt,pw)!==a.hash)return'That password does not match.';
    await flushNow();
    store.acct={id,name:a.name||id,hash:a.hash};saveSession();setBase();loadLocal();await pull();
    return'';
  }catch(e){return'Could not sign in. Check your connection and try again.'}
}

function restDb(){

    collection(){return{

  let n=b?Math.max(1,Math.round(b*.75)):e.def;
  if(target)n=Math.min(target,b?Math.max(n,1):Math.max(1,Math.ceil(target/2)));
  if(e.u==='sec'&&n>=10)n=Math.round(n/5)*5;
  return n;
}
function pickFor(g,count,skip=new Set()){
  const st=stats(),t=today(),out=[];
  const add=(id,n)=>{if(out.length<count&&!skip.has(id)&&X(id).g===g&&X(id)!==GONE&&!out.find(o=>o.ex===id))out.push({id:uid(),ex:id,n,sets:3})};
  for(const pr of S.projects){const ps=projStatus(pr);if(ps.cur>=0){const s=ps.steps[ps.cur];add(s.ex,trainAt(s.ex,s.target))}}
  Object.keys(st.by).map(id=>({id,gap:diffDays(t,st.by[id].last)})).filter(o=>o.gap>=4).sort((a,b)=>b.gap-a.gap).forEach(o=>add(o.id,trainAt(o.id)));
  const done=Object.keys(st.by).filter(id=>X(id).g===g),lvl=done.length?done.reduce((a,id)=>a+X(id).d,0)/done.length:g==='stretch'?.5:1.5;
  allEx().filter(e=>e.g===g).sort((a,b)=>Math.abs(a.d-lvl)-Math.abs(b.d-lvl)).forEach(e=>add(e.id,trainAt(e.id)));
  return out;
}
function autofillDay(d,focus){
  const main=focus.filter(g=>g!=='stretch'),per=main.length<=1?5:main.length===2?3:2,items=[];
  const y=S.plan[addDays(d,-1)],skip=new Set((y?.items||[]).map(i=>i.ex));
  main.forEach(g=>items.push(...pickFor(g,per,skip)));
  if(focus.includes('stretch')){
    // stretches are chosen to match the muscles the rest of the day works
    const used=new Set();items.forEach(it=>X(it.ex).m.forEach(k=>used.add(k)));
    allEx().filter(e=>e.g==='stretch'&&e.d<=1.5).map(e=>({e,s:e.m.filter(k=>used.has(k)).length*2+e.p.filter(k=>used.has(k)).length,r:hash(e.id+d)}))
      .sort((a,b)=>b.s-a.s||a.r-b.r).slice(0,main.length?3:6).forEach(({e})=>items.push({id:uid(),ex:e.id,n:e.def,sets:1}));
  }
  S.plan[d]={focus:[...focus],items};
}
const planDone=(d,it)=>S.log.filter(e=>e.d===d&&e.ex===it.ex).length;

/* ---- stretches to do first when a body area has not been trained for a while */
const COLD=4;
const areaGap=g=>{const l=stats().grp[g];return l?diffDays(today(),l):9999};
function warmupFor(e,force=false){
  if(!e||e===GONE||e.g==='stretch')return[];
  if(!force&&areaGap(e.g)<COLD)return[];
  return allEx().filter(s=>inG(s,'stretch')&&s.d<=1.5&&s.id!==e.id).map(s=>{
    const hit=s.m.filter(k=>e.m.includes(k)).length;
    return{s,hit,v:hit*2+s.m.filter(k=>e.p.includes(k)).length*.5+s.p.filter(k=>e.m.includes(k)).length*.5+(WARM.has(s.id)?1.5:0)};
  }).filter(o=>o.hit||o.v>=2).sort((a,b)=>b.v-a.v||a.s.name.localeCompare(b.s.name)).slice(0,2).map(o=>o.s);
}
const warmLine=e=>{const w=warmupFor(e);return w.length?`<span class="meta warm"><span class="dot" style="--c:var(--lime)"></span>Stretch first: ${w.map(s=>esc(s.name)).join(', ')}</span>`:''};

};
const closeList=()=>S.projects.map(pr=>({pr,st:projStatus(pr)})).filter(o=>o.st.cur>=0).map(o=>{const s=o.st.steps[o.st.cur];return{...o,s,ratio:Math.min(1,s.best/s.target)}}).sort((a,b)=>b.ratio-a.ratio);
const staleList=()=>{const st=stats(),t=today();return Object.keys(st.by).filter(id=>X(id)!==GONE).map(id=>({id,gap:diffDays(t,st.by[id].last)})).filter(o=>o.gap>=4).sort((a,b)=>b.gap-a.gap)};
const areaList=()=>{const st=stats(),t=today();return Object.keys(GROUPS).map(g=>({g,gap:st.grp[g]?diffDays(t,st.grp[g]):9999})).sort((a,b)=>b.gap-a.gap)};

SEC.points.compare=()=>{

function preview(id,n,d,sets){

  for(let i=0;i<sets;i++){const sc=score(id,n,d,tmp);for(const k of['base','fresh','peak','step','total'])tot[k]+=sc[k];tot.flags+=sc.flags;tmp.push({ex:id,n,d,t:0})}

const quickAmts=e=>{const r=refOf(e),out=[];[.5,.75,1,1.33,1.67,2].forEach(k=>{let n=Math.max(1,Math.round(r*k));if(e.u==='sec'&&n>=15)n=Math.round(n/5)*5;if(!out.includes(n))out.push(n)});return out};
function leadUp(id){
  const e=X(id);let best=null;
  for(const c of CHAINS){const i=c.indexOf(id);if(i>0&&(!best||i>best.length-1))best=c.slice(0,i+1)}
  if(!best){ // no ready-made ladder: pick easier moves that share the most muscles, one per difficulty level
    const cand=allEx().filter(x=>x.d<e.d&&x.id!==id).map(x=>({x,s:(x.g===e.g?2:0)+x.m.filter(k=>e.m.includes(k)).length*2+x.m.filter(k=>e.p.includes(k)).length+x.p.filter(k=>e.m.includes(k)).length})).filter(o=>o.s>=3);
    const lv={};cand.forEach(o=>{if(!lv[o.x.d]||o.s>lv[o.x.d].s)lv[o.x.d]=o});
    best=Object.keys(lv).map(Number).sort((a,b)=>a-b).slice(-5).map(k=>lv[k].x.id).concat(id);

  best=best.slice(-8);

}

/* ---- move a log between copies */
const exportText=()=>JSON.stringify({chalkline:1,custom:S.custom,projects:S.projects,plan:S.plan,layout:S.layout,log:S.log});
function importText(txt){
  let o;try{o=JSON.parse(txt)}catch(e){return'That text is not a Chalkline log. Copy all of it and try again.'}
  if(!o||o.chalkline!==1||!Array.isArray(o.log))return'That text is not a Chalkline log. Copy all of it and try again.';
  const have=new Set(S.log.map(e=>e.id)),now=Date.now();let k=0;
  for(const e of o.log){if(!e||!e.ex||!e.d||!(e.n>0)||have.has(e.id))continue;S.log.push({id:uid()+(k++),ex:String(e.ex),n:+e.n,d:String(e.d).slice(0,10),t:now+k,p:+e.p||0,b:Array.isArray(e.b)?e.b.slice(0,4).map(Number):[+e.p||0,0,0,0],f:String(e.f||'')})}
  if(o.custom&&typeof o.custom==='object')S.custom=o.custom;
  if(Array.isArray(o.projects)&&o.projects.length)S.projects=o.projects;
  if(o.plan&&typeof o.plan==='object')S.plan=o.plan;
  if(o.layout&&typeof o.layout==='object')S.layout=o.layout;
  bump();new Set(S.log.map(e=>'log-'+e.d.slice(0,7))).forEach(dirty);dirty('main');
  return'';
}

/* ---- sample + erase */
function genSample(){
  const t=today(),R=rng(42),T0=Date.now();let seq=0;
  const set={1:[['incpush',12,1],['pushup',9,1.4],['dip',3,.7],['pike',5,.8],['support',15,3],['plean',8,2.500]],2:[['hang',20,4],['row',7,.8],['pullup',3,.6],['chinup',3,.6],['tuckfl',3,.9],['hknee',6,.8]],4:[['squat',14,1.5],['lunge',8,.7],['stepup',9,.7],['wallsit',25,4],['bridge',10,1],['calf',14,1]],6:[['plank',30,5],['hollow',15,3],['lraise',8,1],['tucksit',6,1.5],['frog',10,3],['pushup',10,1.4]]};
  for(let back=48;back>=1;back--){
    const d=addDays(t,-back),day=pd(d),list=set[day.getDay()];if(!list||R()<.1)continue;
    const wk=(48-back)/7;
    for(const [id,base,gain] of list){ if(R()<.22)continue;
      const sets=2+(R()<.5?1:0);
      for(let i=0;i<sets;i++){const e=X(id);let n=Math.max(1,Math.round((base+gain*wk)*(.82+R()*.3)*(1-i*.08)));if(e.u==='sec'&&n>10)n=Math.round(n/5)*5;
        const sc=score(id,n,d);S.log.push({id:uid()+(seq),ex:id,n,d,t:T0+(seq++),p:sc.total,b:[sc.base,sc.fresh,sc.peak,sc.step],f:sc.flags});}
    }
  }
  bump();new Set(S.log.map(e=>'log-'+e.d.slice(0,7))).forEach(dirty);
}
function eraseAll(){
  const months=new Set(Object.keys(S.ts).filter(k=>k.startsWith('log-')));S.log.forEach(e=>months.add('log-'+e.d.slice(0,7)));
  S=blank();S.wiped=Date.now();bump();months.forEach(dirty);dirty('main');
}

  xg2(d){const x=top_().draft;x.g2=x.g2||[];const i=x.g2.indexOf(d.id);i<0?x.g2.push(d.id):x.g2.splice(i,1);renderModal()},
  xdiff(d){const x=top_().draft;x.d=Math.max(.5,Math.min(6,x.d+ +d.by));renderModal()},
  xdef(d){const x=top_().draft;x.def=stepAmt(x,x.def,+d.by);renderModal()},
  musc(d){const x=top_().draft,k=d.m;if(x.m.includes(k)){x.m=x.m.filter(v=>v!==k);x.p.push(k)}else if(x.p.includes(k))x.p=x.p.filter(v=>v!==k);else x.m.push(k);renderModal()},
  xsave(){const x=top_().draft;x.name=x.name.trim();if(!x.name)return note('Give the exercise a name first.');const id=x.id||'c-'+uid();S.custom[id]={...x,id,custom:true};delete figCache[id];saveMain();ui.modals=[];renderModal();render();note('Exercise saved.')},
  xdel(){if(ui.confirm!=='xdel'){ui.confirm='xdel';return renderModal()}const id=top_().draft.id;delete S.custom[id];S.projects.forEach(p=>p.steps=p.steps.filter(s=>s.ex!==id));for(const k in S.plan)S.plan[k].items=S.plan[k].items.filter(i=>i.ex!==id);bump();saveMain();ui.modals=[];renderModal();render();note('Exercise deleted.')},
  // pickers
  pick(d){openModal({type:'pick',for:d.for,q:''})},
  pickit(d){const m=top_(),e=X(d.id);
    if(m.for==='step'){const pr=curProj();pr&&pr.steps.push({ex:d.id,target:e.def})}
    else{const pl=planOf(ui.planDay);pl.items.push({id:uid(),ex:d.id,n:trainAt(d.id),sets:3});if(!pl.focus.includes(e.g))pl.focus.push(e.g)}
    saveMain();closeModal();render()},
  // projects
  proj(d){ui.modals=[];renderModal();ui.tab='projects';ui.project=d.id;ui.editProj=false;ui.arrange=false;render();window.scrollTo(0,0)},
  projback(){ui.project=null;ui.editProj=false;render()},
  newproj(){const used=S.projects.map(p=>p.color),c=Object.keys(PIG).find(k=>!used.includes(k))||'rose',p={id:'p-'+uid(),name:'New project',color:c,steps:[]};S.projects.push(p);saveMain();ui.project=p.id;ui.editProj=true;render();window.scrollTo(0,0)},
  editproj(){ui.editProj=!ui.editProj;bump();render()},
  delproj(){if(ui.confirm!=='delproj'){ui.confirm='delproj';return render()}S.projects=S.projects.filter(p=>p.id!==ui.project);ui.project=null;ui.editProj=false;saveMain();render()},
  pcolor(d){curProj().color=d.id;saveMain();render()},
  starget(d){const s=curProj().steps[+d.i];s.target=stepAmt(X(s.ex),s.target,+d.by);saveMain();render()},
  smove(d){const st=curProj().steps,i=+d.i,j=i+ +d.by;if(j<0||j>=st.length)return;[st[i],st[j]]=[st[j],st[i]];saveMain();render()},
  sdel(d){curProj().steps.splice(+d.i,1);saveMain();render()},
  // plan
  planday(d){ui.planDay=d.d;render()},
  goplan(d){ui.planDay=d.d;ui.tab='plan';ui.arrange=false;render();window.scrollTo(0,0)},
  focus(d){const pl=planOf(ui.planDay),i=pl.focus.indexOf(d.id);i<0?pl.focus.push(d.id):pl.focus.splice(i,1);saveMain();render()},
  autoday(d){
    const day=d.d;let focus=S.plan[day]?.focus||[];
    if(!focus.length){const st=stats();focus=Object.keys(GROUPS).filter(g=>g!=='stretch').sort((a,b)=>(st.grp[a]||'').localeCompare(st.grp[b]||'')).slice(0,2);if(ui.auto.stretch)focus.push('stretch')}
    autofillDay(day,focus);ui.planDay=day;saveMain();render();
  },
  clearday(){delete S.plan[ui.planDay];saveMain();render()},
  pdel(d){planOf(ui.planDay).items.splice(+d.i,1);saveMain();render()},
  pset(d){const it=planOf(ui.planDay).items[+d.i];if(d.k==='sets')it.sets=Math.max(1,Math.min(10,it.sets+ +d.by));else it.n=stepAmt(X(it.ex),it.n,+d.by);saveMain();render()},
  autoset(d){if(d.k==='replace'||d.k==='stretch')ui.auto[d.k]=!ui.auto[d.k];else ui.auto[d.k]=d.k==='days'?+d.id:d.id;render()},
  autoweek(){
    const t=today(),pat=DAYPAT[ui.auto.days],seq=SPLITS[ui.auto.split].seq,st=stats();
    const age=f=>Math.min(...f.map(g=>st.grp[g]?diffDays(t,st.grp[g]):999));
    let k=seq.reduce((bi,f,i)=>age(f)>age(seq[bi])?i:bi,0),made=0;
    for(let i=0;i<7;i++){const d=addDays(t,i),has=S.plan[d]?.items.length;
      if(has&&!ui.auto.replace)continue;
      if(!pat[i]){if(has)delete S.plan[d];continue}
      autofillDay(d,ui.auto.stretch?[...seq[k%seq.length],'stretch']:seq[k%seq.length]);k++;made++}
    saveMain();render();note(made?`Planned ${made} ${made===1?'day':'days'}.`:'Those days are already planned. Turn on replace to overwrite them.');
  },
  // filters
  chart(d){ui.chart=d.id;render()},bestg(d){ui.bestG=d.id;render()},libg(d){ui.libG=d.id;render()},libsort(d){ui.libSort=d.id;render()},morehist(){ui.histN+=14;render()},
  // layout
  secmove(d){setLayout(ui.tab,L=>{const vis=L.order.filter(i=>!L.hidden.includes(i)),a=vis.indexOf(d.id),b=a+ +d.by;if(b<0||b>=vis.length)return;const i=L.order.indexOf(vis[a]),j=L.order.indexOf(vis[b]);[L.order[i],L.order[j]]=[L.order[j],L.order[i]]});render()},
  secsize(d){setLayout(ui.tab,L=>{const def=tabOf(ui.tab).secs.find(s=>s[0]===d.id)[2],cur=L.size[d.id]||def;L.size[d.id]=cur==='half'?'full':'half'});render()},
  sechide(d){setLayout(ui.tab,L=>{L.hidden.push(d.id)});render()},
  secshow(d){setLayout(ui.tab,L=>{L.hidden=L.hidden.filter(i=>i!==d.id)});render()},
  // settings
  sample(){if(S.log.length)return;genSample();ui.modals=[];renderModal();render();note('Sample history added.')},
  erase(){if(ui.confirm!=='erase'){ui.confirm='erase';return renderModal()}eraseAll();ui.modals=[];ui.project=null;renderModal();render();note('Everything erased.')},
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el||el.disabled)return;
  const a=el.dataset.a;if(ui.confirm&&ui.confirm!==a)ui.confirm=null;
  if(A[a])A[a](el.dataset,el);
});
const I={
  logq(v){ui.logQ=v;$('#logres').innerHTML=logResults()},
  libq(v){ui.libQ=v;$('#libres').innerHTML=libResults()},
  pickq(v){const m=top_();m.q=v;$('#pickres').innerHTML=pickResults(m)},
  mn(v){const m=top_();m.n=Math.max(0,Math.min(9999,Math.round(+v||0)));$('#pre').innerHTML=m.n?preHTML(m):''},
  mdate(v){const m=top_();if(v&&v<=today()){m.d=v;renderModal()}},
  xname(v){top_().draft.name=v},
  aname(v){top_().name=v},
  kkey(v){top_().key=v},
  imp(v){ui.imp=v},
  apw(v){top_().pw=v},
  xdesc(v){top_().draft.desc=v},
  pname(v){const p=curProj();if(p)p.name=v},
};
document.addEventListener('input',ev=>{const k=ev.target.dataset&&ev.target.dataset.i;if(k&&k!=='mdate'&&I[k])I[k](ev.target.value)});
document.addEventListener('change',ev=>{const k=ev.target.dataset&&ev.target.dataset.i;
  if(k==='mdate')I.mdate(ev.target.value);
  if(k==='pname'){const p=curProj();if(p){p.name=p.name.trim()||'Untitled project';saveMain();render()}}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&ui.modals.length)closeModal();
  if(ev.key==='Enter'&&top_()&&(top_().type==='auth'||top_().type==='key')&&ev.target.closest&&ev.target.closest('.sheet')&&ev.target.tagName==='INPUT'){ev.preventDefault();top_().type==='key'?A.keygo():A.authgo()}
});

injectWashes();
try{const q=new URLSearchParams(location.search),k=q.get('key');if(k){setKey(k);q.delete('key');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash)}}catch(e){}
{const s0=readSession();if(s0){store.acct=s0;setBase()}}
loadLocal();render();initCloud();
</script>
